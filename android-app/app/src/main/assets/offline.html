<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hors ligne — BOOK FOREVER</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    justify-content: center; align-items: center; gap: 18px; padding: 32px 26px;
    background: #14110E; color: #F5EFE6; text-align: center;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .mark { width: 64px; height: 64px; border: 1px solid rgba(201,162,39,.5); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; color: #C9A227; font-size: 26px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 500;
    font-size: 26px; margin: 4px 0 0; letter-spacing: .01em; }
  p { margin: 0; max-width: 30ch; line-height: 1.6; color: rgba(245,239,230,.72); font-size: 15px; }
  button { margin-top: 10px; padding: 13px 26px; border: 0; border-radius: 999px;
    background: #C9A227; color: #14110E; font-size: 15px; font-weight: 600; letter-spacing: .01em; }
  .hint { font-size: 12.5px; color: rgba(245,239,230,.45); max-width: 28ch; }
</style>
</head>
<body>
  <div class="mark">✦</div>
  <h1>Pas de connexion</h1>
  <p>L’application a besoin d’internet pour ouvrir la bibliothèque et vos chapitres.</p>
  <button onclick="location.href='https://book-forever.onrender.com/'">Réessayer</button>
  <p class="hint">Si le réseau est lent, le serveur peut mettre jusqu’à une minute à se réveiller.</p>
</body>
</html>
