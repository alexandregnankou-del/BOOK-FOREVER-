name: Surveillance du site

on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier /api/health
        run: |
          set -e
          URL="https://book-forever.onrender.com/api/health"
          body=$(curl -sS --max-time 60 --retry 3 --retry-delay 15 "$URL")
          echo "réponse : $body"
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"release":"v8"\|"release":"v9"\|"version":"1.8'
          echo "Site disponible."

      - name: Vérifier la page d'accueil et l'APK
        run: |
          set -e
          curl -sS -o /dev/null -w "accueil %{http_code}\n" --max-time 60 --retry 3 https://book-forever.onrender.com/
          curl -sS -o /dev/null -w "apk %{http_code} %{content_type}\n" --max-time 60 --retry 3 \
            https://book-forever.onrender.com/download/book-forever-v8.apk
